name: Check production build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check shared likes API
        run: npm run test:likes

      - name: Build single-file
        run: npm run build:single

      # Deployment uses Cloudflare Pages' existing GitHub integration.
      - name: Preserve the verified standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: standalone-site
          path: single-file/index.html
